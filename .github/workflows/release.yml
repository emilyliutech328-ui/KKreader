name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 生成 local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # ============ 还原签名密钥库 ============
      # 密钥库不入库，存放在 Secrets：
      #   KEYSTORE_BASE64    -> base64 编码的 .jks 文件内容
      #   KEYSTORE_PASSWORD  -> storePassword
      #   KEY_ALIAS          -> keyAlias
      #   KEY_PASSWORD       -> keyPassword
      - name: 还原签名密钥库
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64，无法签出正式包"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "密钥库已还原，大小：$(stat -c%s "$RUNNER_TEMP/release.jks") 字节"

      - name: 写入签名配置
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 写到用户级 gradle.properties，不进入仓库
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> ~/.gradle/gradle.properties

      - name: 构建 Release APK
        run: ./gradlew assembleAppRelease --no-daemon --stacktrace

      - name: 校验签名
        run: |
          APK=$(find app/build/outputs/apk/app/release -name "*.apk" | head -n 1)
          echo "检查 $APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/app/release/*.apk
          generate_release_notes: true
          body: |
            ## 安装说明

            - 包名 `io.qingfeng.reader.release`
            - 与 Legado 官方版、「KK读书」可共存安装
            - 首次安装或跨大版本升级建议先备份阅读记录

            ## 校验

            SHA-256: `${{ env.APK_SHA256 }}`

            ## 许可

            本项目遵循 GPL-3.0，源码见本仓库。
            在线内容由你的书源决定，本项目不提供书库。
