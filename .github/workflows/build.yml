name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # GitHub 的 ubuntu-latest runner 预装 Android SDK（ANDROID_SDK_ROOT），
      # 只需补装项目要求的 compileSdk 36 平台与 build-tools。
      - name: 安装 Android SDK 平台
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK 路径: $SDK"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::找不到 Android SDK，runner 环境异常"
            exit 1
          fi
          echo "现有 platforms:"; ls "$SDK/platforms" 2>/dev/null || echo "(空)"

          SDKM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKM" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          echo "sdkmanager: $SDKM"

          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || {
            echo "::warning::SDK 安装失败，尝试继续（runner 可能已预装）"
          }
          echo "安装后 platforms:"; ls "$SDK/platforms"

      - name: 从 runner 探测插件仓库可达性
        run: |
          echo "===== 探测各插件仓库能否拿到 KSP marker POM ====="
          for u in \
            "https://maven.aliyun.com/repository/gradle-plugin/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.10/com.google.devtools.ksp.gradle.plugin-2.3.10.pom" \
            "https://maven.aliyun.com/repository/public/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.10/com.google.devtools.ksp.gradle.plugin-2.3.10.pom" \
            "https://plugins.gradle.org/m2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.10/com.google.devtools.ksp.gradle.plugin-2.3.10.pom" \
            "https://repo1.maven.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.10/com.google.devtools.ksp.gradle.plugin-2.3.10.pom"
          do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 -L "$u" 2>/dev/null || echo "ERR")
            echo "  HTTP $code  <- $u"
          done
          echo "===== gradle 版本与 JDK ====="
          ./gradlew --version 2>&1 | head -n 12 || true

      - name: 生成 local.properties
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      - name: 单元测试
        run: |
          set +e
          ./gradlew testAppDebugUnitTest --stacktrace --info 2>&1 | tee /tmp/test.log
          RC=${PIPESTATUS[0]}
          if [ $RC -ne 0 ]; then
            echo "=========================================="
            echo "单元测试失败，以下是关键日志（便于诊断）"
            echo "=========================================="
            grep -E "FAILED|ClassNotFound|initializationError|What went wrong|Execution failed|Caused by|Exception" /tmp/test.log | head -n 60 || true
            echo "------------------------------------------"
            echo "失败用例详情："
            find app/build/test-results -name "*.xml" -exec sh -c '
              grep -l "failures=\"[1-9]\|errors=\"[1-9]" "$1" 2>/dev/null | while read f; do
                echo "--- $f"
                sed -n "s/.*<failure message=\"\([^\"]*\)\".*/  FAIL: \1/p" "$f" | head -n 5
                sed -n "s/.*<error message=\"\([^\"]*\)\".*/  ERR: \1/p" "$f" | head -n 5
              done' _ {} \; 2>/dev/null || true
            echo "=========================================="
            exit $RC
          fi
          echo "单元测试通过"

      - name: 构建 Debug APK
        run: ./gradlew assembleAppDebug --stacktrace

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 7

      - name: 上传 Debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: debug-apk
          path: app/build/outputs/apk/app/debug/*.apk
          retention-days: 7
