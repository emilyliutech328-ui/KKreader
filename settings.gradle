pluginManagement {
    repositories {
        // ===== 官方仓库优先 =====
        // 曾经把阿里云镜像放前面「国内更快」，但镜像存在两类问题：
        //   1) 对 com.google.devtools.ksp 这类插件返回 502（而非 404），
        //      Gradle 收到 5xx 会直接判定该资源不可用并停止尝试后续仓库，
        //      导致 CI 上 KSP 插件永远解析不到；
        //   2) 镜像同步有延迟，新版本插件经常缺失。
        // 因此官方源前置，镜像作兜底（国内失败时会自动回落到镜像）。
        gradlePluginPortal()

        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()

        // ===== 镜像兜底 =====
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // ===== 官方仓库优先（原因同 pluginManagement）=====
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        maven {
            url = 'https://jitpack.io'
            content {
                includeGroupByRegex("com\\.github.*")
            }
        }
        mavenCentral()

        // ===== 镜像兜底 =====
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}
rootProject.name = 'legado'

include ':app'
include ':modules:book'
include ':modules:rhino'